<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather</title>
</head>
<body>
    <div class="app">
        <div class="weather-main">
            <p class="city">San Francisco</p>
            <p class="temp">21°</p>
            <p class="condition">Mostly Clear</p>
        </div>

        <div class="details">
            <div class="detail-grid">
                <div class="detail-card">
                    <span class="detail-label">WIND</span>
                    <span class="detail-value">12 km/h</span>
                    <span class="detail-sub">NW</span>
                </div>
                <div class="detail-card">
                    <span class="detail-label">HUMIDITY</span>
                    <span class="detail-value">62%</span>
                    <span class="detail-sub">Dew point: 13°</span>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
